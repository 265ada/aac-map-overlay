# Builds and publishes a release when a version tag is pushed:
#   1. bump __version__ in version.py (e.g. "1.0.1") and commit
#   2. git tag v1.0.1 && git push origin main v1.0.1
# Installed overlays find the new release on their next start (or within
# 6 hours while running) and update themselves.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check version.py matches the tag
        shell: pwsh
        run: |
          $v = (Select-String -Path version.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne $env:TAG) { throw "version.py says $v but the tag is $env:TAG" }

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }

      - name: Build exe and installer
        shell: pwsh
        run: ./build.ps1 -Python python

      - name: Zip the portable copy
        shell: pwsh
        run: Compress-Archive -Path dist\AACMapOverlay\* -DestinationPath dist\AACMapOverlay-portable.zip

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = "dist\AACMapOverlay-Setup.exe", "dist\AACMapOverlay-portable.zip"
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload $env:TAG $files --clobber }
          else { gh release create $env:TAG $files --title "AAC Map Overlay $($env:TAG.TrimStart('v'))" --generate-notes }
